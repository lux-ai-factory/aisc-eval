[project]
name = "aisc-eval"
version = "0.2.4"
description = "Evaluation service for AISC"
authors = [
    { name = "Thibault Simonetto", email = "thibault.simonetto@uni.lu" },
    { name = "Maxime Cordy", email = "maxime.cordy@uni.lu" },
]
maintainers = [
    { name = "Université du Luxembourg" },
    { name = "Luxembourg Institute of Science and Technology (LIST)" },
]
requires-python = "~=3.12.0"
readme = "README.md"
dependencies = [
    "pydantic>=2.13.5,<3",
    "pandas>=2.3.3,<3",
    "pyarrow>=19.0.1,<20",
    "pandas-stubs>=2.3.3.260113,<3",
    "scipy>=1.18.1,<2",
    "requests>=2.34.2,<3",
    "celery[redis]>=5.6.3",
    "flower>=2.2.0",
    "aisc-plugin-manager>=0.2.7",
    "aisc-plugin-interface>=0.2.6",
    "jsonschema>=4.26.0",
    "requests>=2.34.2",
    "cryptography>=50.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7.4,<0.8",
    "isort>=5.13.2,<6",
    "mypy>=1.20.2,<2",
    "pytest>=8.4.2,<9",
    "pytest-cov>=6.3.0,<7",
    "pylint>=3.3.9,<4",
    "graphviz>=0.20.3,<0.21",
    "pre-commit>=4.6.2,<5",
    "pip-licenses>=5.5.5",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
]
test = [
    "pytest>=8.4.2,<9",
    "pytest-cov>=6.3.0,<7",
    "pytest-mock>=3.15.1,<4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aisc-plugin-manager = { git = "https://github.com/lux-ai-factory/aisc-plugin-manager", tag = "v0.2.7" }

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 79

[tool.pylint]
disable = [
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116"   # Missing function or method docstring
]

[tool.mypy]
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
ignore_missing_imports = true
