name: VERA-eval pipeline for github ported from gitlab

on:
  push:
    branches:
      - "master"
      - "dev"
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  UV_VERSION: ${{ vars.EVAL_UV_VERSION }}
  PYTHON_VERSION: ${{ vars.EVAL_PYTHON_VERSION }}
  BASE_LAYER: ${{ vars.EVAL_BASE_LAYER }}
  UV_LINK_MODE: "copy"
  UV_CACHE_DIR: ".uv-cache"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    name: Linting and formatting stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          restore-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Do the linting
        run: uv run ruff check .
      - name: Do the format check
        run: uv run ruff format --check .

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Generate LFS file list, we'll need this for caching LFS files
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore cache, if needed
        id: lfs-cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ runner.os }}-git-lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Is it a cache hit or a miss?
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        run: echo "::warning HITorMISS::GOT A MISS"
      - name: Ensure all LFS files are available
        run: git lfs pull
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          restore-cache: true
      - name: Install test dependencies
        run: uv sync --frozen --no-dev --group test
      - name: Run tests
        run: uv run pytest

  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

  generate-sbom-and-scan-it:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ ENV.REGISTRY }}/${{ github.repository }}@${{ needs.build-and-push-image.outputs.image-digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          sbom: sbom.cdx.json
          fail-build: false # Do not fail if threshold reached
          severity-cutoff: high # Keep cutoff on high, anyway the build will not fail because of prev setting
          output-format: table

      - name: Archive SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
